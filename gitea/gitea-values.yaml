replicaCount: 1

persistence:
  enabled: true
  storageClass: gp3
  size: 10Gi
  accessModes:
    - ReadWriteOnce

service:
  http:
    type: LoadBalancer
    port: 3000
  ssh:
    type: LoadBalancer
    port: 22

gitea:
  admin:
    # SOPS-encrypted, decrypted by ArgoCD via ksops - see secrets/gitea-admin-secret.enc.yaml
    existingSecret: gitea-admin-secret
  # Gitea's own chart bakes postgresql-ha.global.postgresql.password into its
  # config as a literal at render time - there's no secretKeyRef path for that
  # field. Left blank below, so this override applies the *real* password
  # (auto-generated by Bitnami's postgresql-ha chart, never in git) after the
  # fact, via Gitea's own GITEA__section__KEY env-override mechanism.
  additionalConfigFromEnvs:
    - name: GITEA__database__PASSWD
      valueFrom:
        secretKeyRef:
          name: gitea-postgresql-ha-postgresql
          key: password

# Single-instance Postgres is handled by the postgresql-ha subchart below.
postgresql:
  enabled: false

postgresql-ha:
  enabled: true
  global:
    postgresql:
      username: gitea
      database: gitea
      # Left blank on purpose - see gitea.additionalConfigFromEnvs above.
      # Bitnami's common helper generates a random value here since both this
      # and postgresql.password (below) resolve empty, and stores it in the
      # gitea-postgresql-ha-postgresql Secret under the "password" key.
      password: ""
  postgresql:
    # Blank out the chart's published "changeme" defaults so Bitnami's
    # common helper generates random values instead, stored in its own Secret.
    postgresPassword: ""
    repmgrPassword: ""
  pgpool:
    adminPassword: ""
    srCheckPassword: ""
  persistence:
    storageClass: gp3
    size: 10Gi

valkey-cluster:
  persistence:
    storageClass: gp3
