apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      volumes:
        - name: custom-tools
          emptyDir: {}
      initContainers:
        - name: install-tools
          image: alpine:3.18
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache curl tar bash

              mkdir -p /custom-tools/bin
              mkdir -p /custom-tools/kustomize-plugins/viaduct.ai/v1/ksops

              echo "Installing sops..."
              curl -sL -o /custom-tools/bin/sops \
                https://github.com/getsops/sops/releases/download/v3.9.0/sops-v3.9.0.linux.amd64
              chmod +x /custom-tools/bin/sops

              echo "Installing ksops..."
              curl -sL https://raw.githubusercontent.com/viaduct-ai/kustomize-sops/master/scripts/install-ksops-archive.sh \
                | bash -s /custom-tools

              cp /custom-tools/ksops /custom-tools/bin/ksops
              cp /custom-tools/ksops /custom-tools/kustomize-plugins/viaduct.ai/v1/ksops/ksops
              chmod +x /custom-tools/bin/ksops \
                        /custom-tools/kustomize-plugins/viaduct.ai/v1/ksops/ksops

              echo "Done."
          volumeMounts:
            - mountPath: /custom-tools
              name: custom-tools
      containers:
        - name: argocd-repo-server
          env:
            - name: PATH
              value: "/custom-tools/bin:/usr/local/bin:/usr/bin:/bin"
            - name: KUSTOMIZE_PLUGIN_HOME
              value: /custom-tools/kustomize-plugins
          volumeMounts:
            - mountPath: /custom-tools
              name: custom-tools
