apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com            # the EBS CSI driver, wired via Pod Identity

volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true              
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
